# /etc/wsl.conf — Ropex development distro.
# Installed by `bash scripts/wsl-setup.sh`. Apply with `wsl --shutdown` from
# Windows, then reopen the distro.

[boot]
# Rootless Podman, user services and timers need a real init.
systemd = true

[automount]
enabled = true
# metadata lets chmod/chown stick on /mnt/c so `scripts/*.sh` stay executable
# if you ever read the repo from the Windows drive. Keep the repo on ext4 anyway.
options = "metadata,umask=22,fmask=11"
mountFsTab = true

[interop]
enabled = true
# Keeps `code .`, `explorer.exe .` and `clip.exe` working. The cost is Windows
# entries on PATH — `scripts/wsl-doctor.sh` warns if a Windows node/npm wins.
appendWindowsPath = true

[network]
generateHosts = true
generateResolvConf = true

[user]
# Never run the control plane as root inside WSL.
# default = <your-linux-user>
