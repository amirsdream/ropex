# One click: docker compose up --build
# The worker service builds the harness image and exits. It is not a session.
# Each pipeline builds ropex-session:<id> from that image and deletes it after learn.

services:
  worker:
    image: ropex-worker:latest
    build:
      context: .
      dockerfile: Containerfile.worker
    entrypoint: ["node", "-e", "process.exit(0)"]
    restart: "no"

  control-plane:
    build:
      context: .
      dockerfile: Containerfile
    image: ropex-control-plane:latest
    ports:
      - "${ROPEX_PORT:-7780}:7780"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      ROPEX_EXECUTOR: container
      ROPEX_WORKER_IMAGE: ropex-worker:latest
    volumes:
      - ropex-state:/app/.ropex
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      worker:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:7780/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  ropex-state:
