apiVersion: ropex.dev/v1
kind: GitRepo
metadata:
  name: github-control-plane
spec:
  url: https://github.com/example/ropex-config
  path: fleets/
  branch: main
  interval: 30s
---
apiVersion: ropex.dev/v1
kind: Policy
metadata:
  name: default-guardrails
spec:
  # Cluster-wide ceiling on live workers (static + on-demand spawns).
  maxReplicas: 64
  budget:
    maxUnits: 5000
    windowMs: 3600000
    scope: cluster
  permissions:
    deny:
      - exfiltrate
      - prod-write
    requireApproval:
      - force-push
      - delete-repo
---
apiVersion: ropex.dev/v1
kind: Agent
metadata:
  name: triage
  labels:
    role: github
    zone: ingress
spec:
  # Request-driven: spawn on claim, destroy when idle (idleTTL 0).
  scale: onDemand
  maxConcurrent: 4
  idleTTLMs: 0
  placement:
    require:
      role: github
    prefer:
      zone: ingress
  harness:
    profile: minimal
    model: gpt-4o-mini
    plugins:
      - github
      - fs
  hermes:
    soul: souls/triage.md
    memory: shared
    share:
      read: [agent]
      write: agent
    learning: true
    skills:
      - issue-triage
      - label-hygiene
  github:
    events:
      - issues.opened
      - issues.labeled
    deliver: comment
  selector:
    matchLabels:
      org: acme
---
apiVersion: ropex.dev/v1
kind: Agent
metadata:
  name: reviewer
  labels:
    role: github
    zone: review
spec:
  scale: onDemand
  maxConcurrent: 6
  idleTTLMs: 0
  placement:
    require:
      role: github
    prefer:
      zone: review
    taints:
      - key: code-review
        effect: NoSchedule
    tolerations:
      - key: code-review
        operator: Exists
  harness:
    profile: code
    model: gpt-4o
    plugins:
      - github
      - fs
      - shell
  hermes:
    soul: souls/reviewer.md
    memory: shared
    share:
      read: [agent, fleet]
      write: agent
    learning: true
    skills:
      - pr-review
      - test-gaps
  github:
    events:
      - pull_request.opened
      - pull_request.synchronize
    deliver: comment
  selector:
    matchLabels:
      org: acme
---
apiVersion: ropex.dev/v1
kind: Fleet
metadata:
  name: pr-factory
  labels:
    role: implement
spec:
  # One agent definition; maxConcurrent is the spawn ceiling (not 20 warm replicas).
  scale: onDemand
  maxConcurrent: 8
  idleTTLMs: 0
  replicas: 8
  template:
    metadata:
      labels:
        role: implement
        zone: build
    spec:
      placement:
        require:
          role: implement
        prefer:
          zone: build
        taints:
          - key: builder
            effect: NoSchedule
        tolerations:
          - key: builder
            operator: Exists
      harness:
        profile: standard
        model: gpt-4o
        plugins:
          - github
          - fs
          - shell
          - subagent
      hermes:
        soul: souls/builder.md
        memory: shared
        share:
          read: [agent, fleet]
          write: agent
        learning: true
        # Prefer agent/fleet writes so knowledge survives worker destroy.
        skills:
          - implement-issue
          - open-pr
      github:
        events:
          - issues.labeled
        deliver: pull_request
      selector:
        matchLabels:
          org: acme
