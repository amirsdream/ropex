# Real Cursor on the host. The binary is `agent` on PATH.
# Leave auth unset when exactly one strategy has credentials.
# When both CURSOR_API_KEY and ~/.config/cursor/auth.json exist, set one auth line.
# Cursor cannot deny a single tool, so this policy denies nothing.
apiVersion: ropex.dev/v1
kind: Policy
metadata:
  name: manual-guardrails
spec:
  maxReplicas: 2
  permissions:
    deny: []
    requireApproval: []
---
apiVersion: ropex.dev/v1
kind: Agent
metadata:
  name: cursor-host
spec:
  scale: static
  replicas: 1
  runtime:
    kind: cursor
    # auth: api-key
    # auth: oauth-file
    timeoutMs: 900000
  harness:
    profile: code
    plugins: [fs, shell]
  hermes:
    memory: none
    learning: false
    skills: []
