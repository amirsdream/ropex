# Local embedded harness. Static so the worktree stays after the task.
apiVersion: ropex.dev/v1
kind: Policy
metadata:
  name: manual-guardrails
spec:
  maxReplicas: 2
  permissions:
    deny: []
    requireApproval: []
---
apiVersion: ropex.dev/v1
kind: Agent
metadata:
  name: writer
spec:
  scale: static
  replicas: 1
  harness:
    profile: code
    plugins: [fs, shell]
  hermes:
    memory: none
    learning: false
    skills: []
