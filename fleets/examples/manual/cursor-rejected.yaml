# `auth: oauth` is not a Cursor strategy. `ropex apply` must reject this file.
apiVersion: ropex.dev/v1
kind: Policy
metadata:
  name: manual-guardrails
spec:
  maxReplicas: 2
  permissions:
    deny: []
    requireApproval: []
---
apiVersion: ropex.dev/v1
kind: Agent
metadata:
  name: writer
spec:
  scale: static
  replicas: 1
  runtime:
    kind: cursor
    auth: oauth
    command: node
  harness:
    profile: code
    plugins: [fs, shell]
  hermes:
    memory: none
    learning: false
    skills: []
